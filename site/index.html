<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Helvetica Neue","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.hd{background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;padding:22px 16px 18px;text-align:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hd h1{font-size:24px;font-weight:700;margin-bottom:4px;letter-spacing:.5px}
.hd p{font-size:13px;opacity:.9;margin-top:4px}

.main-nav{display:flex;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:64px;z-index:49;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.main-tab{flex:1;padding:14px 4px;border:none;background:#fff;color:#4b5563;font-size:14px;cursor:pointer;text-align:center;font-weight:600;transition:all .2s;border-bottom:3px solid transparent}
.main-tab.on{color:#2563eb;border-bottom-color:#2563eb;background:#eff6ff}
.main-tab:active{background:#dbeafe}

.sub-nav{display:flex;gap:8px;overflow-x:auto;padding:12px 12px;background:#fff;border-bottom:1px solid #f0f0f0;-webkit-overflow-scrolling:touch}
.sub-nav::-webkit-scrollbar{display:none}
.sub-tab{flex-shrink:0;padding:8px 16px;border:none;background:#f3f4f6;color:#4b5563;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s}
.sub-tab.on{background:#2563eb;color:#fff;font-weight:600}

.panel{display:none}
.panel.on{display:block}

.ct{max-width:900px;margin:0 auto;padding:14px}

.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card img{width:100%;height:auto;display:block;cursor:pointer;min-height:80px;background:#f3f4f6}
.cap{padding:8px 10px;font-size:12px;color:#6b7280;text-align:center;border-top:1px solid #f3f4f6}

.full-shot{width:100%;height:auto;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;margin-bottom:16px}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
tr{border-bottom:1px solid #f3f4f6}
tr:last-child{border-bottom:none}
th{background:#eff6ff;color:#2563eb;font-weight:700;padding:12px 10px;font-size:14px;text-align:left}
td{padding:10px;font-size:13px;vertical-align:top;color:#374151}
td.sec{background:#f9fafb;color:#1f2937;font-weight:700;font-size:14px}
.empty{text-align:center;padding:48px 20px;color:#9ca3af;font-size:14px}

.search-box{width:100%;padding:14px 16px;border:1px solid #e5e7eb;border-radius:12px;font-size:15px;margin-bottom:16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.search-box:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.qa-cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.qa-cat{padding:6px 14px;border-radius:20px;background:#fff;border:1px solid #e5e7eb;font-size:13px;cursor:pointer;color:#4b5563}
.qa-cat.on{background:#2563eb;color:#fff;border-color:#2563eb}
.qa-item{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.qa-q{font-size:16px;font-weight:700;color:#2563eb;margin-bottom:10px}
.qa-a{font-size:14px;color:#4b5563;line-height:1.9}
.qa-tag{display:inline-block;font-size:11px;color:#6b7280;background:#f3f4f6;padding:3px 10px;border-radius:10px;margin-top:10px}
.qa-empty{text-align:center;padding:48px 20px;color:#6b7280;font-size:15px}

.sn-cats{display:flex;gap:10px;margin-bottom:16px}
.sn-cat{flex:1;padding:14px 8px;border-radius:12px;background:#fff;border:1px solid #e5e7eb;text-align:center;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;color:#4b5563}
.sn-cat.on{background:#2563eb;color:#fff;border-color:#2563eb}
.sn-brands{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sn-brand{padding:8px 14px;border-radius:20px;background:#fff;border:1px solid #e5e7eb;font-size:13px;cursor:pointer;transition:all .2s;color:#4b5563}
.sn-brand.on{background:#2563eb;color:#fff;border-color:#2563eb}
.sn-content{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.sn-brand-title{font-size:18px;font-weight:700;color:#2563eb;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #f3f4f6}
.sn-step{font-size:15px;color:#374151;line-height:2.2;white-space:pre-line}

.zm{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:100;justify-content:center;align-items:center}
.zm.show{display:flex}
.zm img{max-width:96vw;max-height:90vh;object-fit:contain;border-radius:6px}
.zm-x{position:absolute;top:12px;right:16px;color:#fff;font-size:32px;cursor:pointer}

@media(max-width:480px){.gallery{grid-template-columns:1fr}.hd h1{font-size:20px}td,th{padding:8px 6px;font-size:12px}.main-tab{font-size:13px;padding:14px 2px}}
</style>

var qaData = [{"question":"菜鸟、拼多多虚拟号失效怎么处理","answer":"菜鸟：\n先在微派后台尝试更新虚拟号！！！\n更新了但是打不通，虚拟号问题自查：\n1、如果虚拟号码中间为逗号，则为新的虚拟号，尝试联系拨打（中间是横杠，则非新号码）；\n2、虚拟号码更新了，但是打不通，可2H后尝试再次刷新；\n3、再次刷新后仍无法拨打，可在反馈表里填报，线下向菜鸟获取，菜鸟虚拟号异常反馈\n【菜鸟虚拟号异常反馈】\n拼多多：\n联系客户经理向商家获取号码","type":"异常处理","escalation":""},{"question":"SN码的其他名称有哪些？","answer":"SN码，中文名为序列号，也有其他名称，如【Serial Number】、【SERIAL  NO.】、【SN】、【S/N】，部分笔记本显示为【S/T】","type":"小技巧","escalation":""},{"question":"拨打*#06#，屏幕提示“出现连接问题或MMI码无效”","answer":"解决步骤：（先检查是不是按对了，一共5个字：*#06#）\n1、切换到飞行模式后再尝试拨打*#06#3、引导客户插好SIM卡后重新尝试拨打*#06#\n2、切换网络重新尝试拨打*#06#\n3、引导客户插好SIM卡后重新尝试拨打*#06#","type":"异常处理","escalation":"滞留标记原因，将快件带回网点，联系各团队接口同事"},{"question":"多次拍照审核不通过","answer":"建议可以先尝试横竖换角度拍摄\n1、除小米自营、荣耀商城、OPPO商城国补件，其他品类可连续拍照三次后，第四次按要求拍照后跳过审核，小米商城件SN码不对不可派送\n2、若第四次无法跳过，且非小米自营国补、荣耀商城、OPPO商城国补件，小哥可上报小哥服务中心（有专人实时答疑）\n3、算法异常可扫码进入右侧群组报障","type":"异常处理","escalation":"杨小平（01369310）"},{"question":"国补件是否可转寄退回","answer":"1、转寄：国补件不可以转寄；\n2、退回：未拆封可直接82退回，已拆封需82上报后待指令是否退回；签收后不允许拒收，引导消费者联系商家处理","type":"异常处理","escalation":"联系各团队接口同事"},{"question":"同城小哥怎么补录？","answer":"1、让同城小哥下载个顺丰小哥APP，用同城小哥的账号登上去，按照顺丰小哥APP的流程补录（流程图见右侧）\n2、同城小哥登不上，可以让小哥咨询同城产品规划处-游萱（同城派大网件的小哥都能登录顺丰小哥APP的）","type":"异常处理","escalation":""},{"question":"号码不对无法妥投","answer":"直接拨打10秒钟就能解除电联管控限制","type":"号码不对","escalation":""},{"question":"同城小哥补录任务时，没有路径","answer":"可线下收集正确的图片给到各品牌专项客服进行后台人工补录","type":"补录","escalation":""},{"question":"需更换其他小哥去补录照片怎么办","answer":"1、任务为未完成状态，小哥未离职，联系对应的品牌专项客服在微派后台指派即可\n2、任务为完成状态，且小哥已离职，拍好照片回来给对应的品牌专项客服在微派后台补录照片","type":"补录","escalation":""},{"question":"AI审核反馈不清晰","answer":"可稍微远一点进行拍摄，不只是拍摄手机屏幕，可将手机框以及背景拍摄一部分进去，但是需要同时确保SN/IMEI码清晰再进行尝试","type":"异常处理","escalation":""},{"question":"2合1照片拍摄技巧","answer":"两个物品均需要保持里面文字方向一致且正向，识别准确率才能更高；","type":"异常处理","escalation":""},{"question":"收方号码不对无法妥投怎么办","answer":"强制拨打10秒解除电联管控，不管有没有拨通","type":"异常处理","escalation":""},{"question":"彩盒丢了怎么办","answer":"务必优先找回，若无法找回可能有理赔风险；实在无法找回的，需留存举证材料（电话沟通录音、客户书面说明等），反馈给专项客服留档，地区也需自行留档","type":"异常处理","escalation":""},{"question":"怎么查看手机、平板的SN码/IMEI码？","answer":"详见本文档附表《各品牌SN码调出指引》","type":"系统类","escalation":"各团队接口同事、周运丹、黄洪涛、程英渊、叶灵"},{"question":"如何识别哪个平台的国补订单","answer":"详见本文档附表《国补订单识别》","type":"系统类","escalation":"各团队接口同事、周运丹、黄洪涛、程英渊、叶灵"},{"question":"系统里怎么看SN码是否正确？怎么查SN\\IMEI码？","answer":"微派提示SN不正确，可以去SISP查看SN是否正确（360诊断-OMS订单-扩展信息-wpExtJson，或者ctrl+F搜索SN或IMEI），若不正确，其中小米件要强制退回，其他电商平台可以三次跳过算法提交","type":"系统类","escalation":""},{"question":"AI校验哪些图片","answer":"1、手机：校验第一张（外包装SN）、第二张（开机激活SN+IMEI）\n2、笔记本：22日上线外包装SN+背面SN校验，\n3、平板：校验外包装SN","type":"系统类","escalation":""},{"question":"怎么监控T-1数据","answer":"（仅适用地区同事申请）\nT-1监控报表：丰景台-客户国补订单运单明细报表_地区","type":"系统类","escalation":""},{"question":"快件已退回的国补任务如何处理？","answer":"1、巴枪滞留“退回”时系统中微派任务会自动终止；（原单退回自动消除任务，新单退回待年后优化自动消除，当前需联系专项客服手工消除）\n2、专项客服下发补录任务时已退回的可以不补，如实反馈情况“快件已退回”。","type":"退回件","escalation":""},{"question":"没有国补任务的怎么处理？","answer":"有国补标识，但无微派任务，按普通件派送即可","type":"无微派任务","escalation":""},{"question":"微派计提怎么兑现？","answer":"1、顺丰小哥：在任务完成后，7天内可以在微应用【一线计提查询】-增值服务计提查看，计提随工资月发放\n2、同城：任务完成后，次日发放到骑士账户，具体路径：骑士APP-今日收入-今日明细，T+3支持体现","type":"计提","escalation":""},{"question":"超范围快件如何处理？","answer":"1、联系客户自取；\n2、若客户不同意自取，上报客服退回；\n3、已提供微派可服务区域信息给到各平台，待平台在下单环节进行管控（预计年后）。","type":"超范围","escalation":"联系各团队接口同事"},{"question":"人工审核错误怎么办","answer":"通过报表《国补件明细查询》查询审核人工号，联系审核人沟通，再次提交上传等待客服审核","type":"人工审核","escalation":""},{"question":"人工审核哪些场景？审核需要多久？","answer":"1、人工审核场景为：AI校验不通过的单（目前拼多多国补件由于图片回传时效原因未配置人工审核）\n2、48H内完成人工审核","type":"无法补录","escalation":""},{"question":"快件显示“审核中”，无法补录怎么办","answer":"此种场景为AI校验不通过流入人工审核，人工还未完成审核导致无法补录，待客服完成审核即可补录","type":"审核中无法补录","escalation":""},{"question":"部分笔记本背面无SN码怎么拍（如机械革命笔记本）","answer":"1、笔记本背面有二维码序列号，拍此二维码，上传的照片要求手机能扫码识别出序列号\n2、笔记本配置了强控，无法3次跳过，若无法上传联系团队接口/专项客服后台补录即可","type":"笔记本背面无SN码","escalation":"联系各团队接口同事，非欧瑞特客户件，则通过SISP-理赔详情查询客户经理，联系客户经理处理"},{"question":"努比亚（小牛）手机部分型号手机盒SN码与IMEI码不在一个面上，怎么拍？","answer":"两个码都需要拍，拍2张照片上传（已反馈客户优化手机盒SN码粘贴位置）","type":"手机盒无SN码","escalation":"张思宇42493370"},{"question":"哪些品牌、类目的国补件无法跳过校验？","answer":"电脑所有品类、小米商城件、OPPO function colLetterToNum(l){let n=0;for(let i=0;i<l.length;i++)n=n*26+(l.charCodeAt(i)-64);return n}
function isCovered(merged,row,col){for(let i=0;i<merged.length;i++){const m=merged[i].match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/);if(!m)continue;const c1=colLetterToNum(m[1]),r1=+m[2],c2=colLetterToNum(m[3]),r2=+m[4];if(row>=r1&&row<=r2&&col>=c1&&col<=c2)return!(col===c1&&row===r1)}return false}
function getSpan(merged,row,col){for(let i=0;i<merged.length;i++){const m=merged[i].match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/);if(!m)continue;const c1=colLetterToNum(m[1]),r1=+m[2],c2=colLetterToNum(m[3]),r2=+m[4];if(row===r1&&col===c1)return{colspan:c2-c1+1}}return null}
function fmt(t){return t?t.replace(/\n/g,'<br>'):''}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function goMain(tab){
  document.querySelectorAll('.main-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', false));
  document.getElementById(tab + '-panel').classList.add('on');
  if (tab === 'photo' && !document.getElementById('photo-subnav').innerHTML) buildPhoto();
  if (tab === 'qa' && !document.getElementById('qa-content').innerHTML) buildQA();
  if (tab === 'sn' && !document.getElementById('sn-content').innerHTML) buildSN();
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildPhoto(){
  const nav = document.getElementById('photo-subnav');
  const ct = document.getElementById('photo-content');
  nav.innerHTML = '';
  ct.innerHTML = '';

  photoData.forEach((s, i) => {
    const t = document.createElement('button');
    t.className = 'sub-tab' + (i === 0 ? ' on' : '');
    t.textContent = s.name;
    t.onclick = function(){goPhoto(i)};
    nav.appendChild(t);
  });

  photoData.forEach((s, i) => {
    const panel = document.createElement('div');
    panel.className = 'sub-panel';
    panel.id = 'photo-' + i;
    panel.style.display = i === 0 ? 'block' : 'none';

    let html = '';

    // Full-page screenshot for first 3 sheets
    if (sheetScreens[s.name]) {
      html += '<img src="' + sheetScreens[s.name] + '" class="full-shot" onclick="zoom(this.src)" alt="' + esc(s.name) + '">';
    }

    // Image gallery for extracted images
    if (s.imageIds && s.imageIds.length > 0 && !sheetScreens[s.name]) {
      html += '<div class="gallery">';
      s.imageIds.forEach(function(imgId, j){
        html += '<div class="card"><img src="images/img_' + imgId + '.jpg" onclick="zoom(this.src)" alt="示例" loading="lazy"><div class="cap">示例 ' + (j + 1) + '</div></div>';
      });
      html += '</div>';
    }

    // Tables
    if (s.rows && s.rows.length > 0) {
      html += '<table>';
      s.rows.forEach(function(row){
        let hasContent = false;
        let rowHTML = '';
        for (let c = 1; c <= s.maxCol; c++) {
          if (isCovered(s.mergedCells, row.rowNum, c)) continue;
          const cell = row.cells.find(function(x){return x.col === c});
          const text = cell ? cell.text : '';
          if (!text.trim()) continue;
          const sp = getSpan(s.mergedCells, row.rowNum, c);
          hasContent = true;
          const colCount = row.cells.filter(function(x){return x.text.trim() === text.trim()}).length;
          let cls = 'td';
          if (colCount >= 4 || text.match(/^[一二三四五六七八九]+[、.]/)) cls = 'sec';
          rowHTML += '<td class="' + cls + '"' + (sp ? ' colspan="' + sp.colspan + '"' : '') + '>' + fmt(text) + '</td>';
        }
        if (hasContent) html += '<tr>' + rowHTML + '</tr>';
      });
      html += '</table>';
    }

    if (!html) html = '<div class="empty">该模块以图片示例为主</div>';
    panel.innerHTML = html;
    ct.appendChild(panel);
  });
}

function goPhoto(i){
  currentSub = i;
  document.querySelectorAll('#photo-subnav .sub-tab').forEach(function(t, idx){t.classList.toggle('on', idx === i)});
  document.querySelectorAll('#photo-content .sub-panel').forEach(function(p, idx){p.style.display = idx === i ? 'block' : 'none'});
}

function buildQA(){
  const cats = ['全部'];
  qaData.forEach(function(q){ if (q.type && !cats.includes(q.type)) cats.push(q.type); });

  const catDiv = document.getElementById('qa-cats');
  catDiv.innerHTML = '';
  cats.forEach(function(c){
    const btn = document.createElement('button');
    btn.className = 'qa-cat' + ((qaFilter === 'all' && c === '全部') || qaFilter === c ? ' on' : '');
    btn.textContent = c;
    btn.onclick = function(){
      qaFilter = c === '全部' ? 'all' : c;
      document.querySelectorAll('.qa-cat').forEach(function(el){ el.classList.remove('on'); });
      btn.classList.add('on');
      renderQA();
    };
    catDiv.appendChild(btn);
  });
  renderQA();
}

function renderQA(items){
  items = items || qaData;
  const container = document.getElementById('qa-content');
  container.innerHTML = '';
  const filtered = items.filter(function(q){ return qaFilter === 'all' || q.type === qaFilter; });

  if (filtered.length === 0) {
    container.innerHTML = '<div class="qa-empty">未搜索到结果，请联系人工</div>';
    return;
  }

  filtered.forEach(function(q){
    const div = document.createElement('div');
    div.className = 'qa-item';
    div.innerHTML = '<div class="qa-q">' + esc(q.question) + '</div>' +
                    '<div class="qa-a">' + fmt(q.answer) + '</div>' +
                    (q.type ? '<span class="qa-tag">' + esc(q.type) + '</span>' : '');
    container.appendChild(div);
  });
}

function searchQA(){
  const rawKw = document.getElementById('qa-search').value.trim();
  if (!rawKw) { renderQA(); return; }

  const kw = rawKw.toLowerCase();
  const kws = kw.split(/\s+/).filter(Boolean);
  const kwBigrams = [];
  for (let i = 0; i < kw.length - 1; i++) kwBigrams.push(kw.substring(i, i + 2));

  const scored = qaData.map(function(q){
    const qText = q.question.toLowerCase();
    const aText = q.answer.toLowerCase();
    const tText = (q.type || '').toLowerCase();
    let score = 0;

    // Exact / contains matches
    if (qText === kw) score += 80;
    if (qText.includes(kw)) score += 40;
    if (aText.includes(kw)) score += 25;
    if (tText.includes(kw)) score += 20;

    // Split keyword matches
    kws.forEach(function(k){
      if (qText.includes(k)) score += 15;
      if (aText.includes(k)) score += 8;
      if (tText.includes(k)) score += 5;
    });

    // Bigram fuzzy match for partial / typo-tolerant Chinese search
    kwBigrams.forEach(function(b){
      if (qText.includes(b)) score += 3;
      if (aText.includes(b)) score += 2;
      if (tText.includes(b)) score += 2;
    });

    return {q, score};
  }).filter(function(item){ return item.score > 0; }).sort(function(a,b){ return b.score - a.score; }).map(function(item){ return item.q; });

  renderQA(scored);
}

function buildSN(){
  const catDiv = document.getElementById('sn-cats');
  Object.keys(snData).forEach(function(cat){
    const btn = document.createElement('button');
    btn.className = 'sn-cat' + (cat === snCategory ? ' on' : '');
    btn.textContent = cat;
    btn.onclick = function(){
      snCategory = cat;
      snBrand = Object.keys(snData[cat])[0];
      document.querySelectorAll('.sn-cat').forEach(function(el){ el.classList.remove('on'); });
      btn.classList.add('on');
      renderSN();
    };
    catDiv.appendChild(btn);
  });
  if (!snBrand || !snData[snCategory][snBrand]) snBrand = Object.keys(snData[snCategory])[0];
  renderSN();
}

function renderSN(){
  const brandDiv = document.getElementById('sn-brands');
  brandDiv.innerHTML = '';
  const brands = Object.keys(snData[snCategory] || {});
  brands.forEach(function(b){
    const btn = document.createElement('button');
    btn.className = 'sn-brand' + (b === snBrand ? ' on' : '');
    btn.textContent = b;
    btn.onclick = function(){snBrand = b; renderSN();};
    brandDiv.appendChild(btn);
  });

  const ct = document.getElementById('sn-content');
  const method = snData[snCategory] && snData[snCategory][snBrand];
  ct.innerHTML = '<div class="sn-content">' +
                   '<div class="sn-brand-title">' + esc(snBrand) + '</div>' +
                   '<div class="sn-step">' + esc(method) + '</div>' +
                 '</div>';
}

function zoom(s){document.getElementById('zi').src=s;document.getElementById('zm').classList.add('show')}
function closeZm(){document.getElementById('zm').classList.remove('show')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeZm()});

buildPhoto();
</script>
