.sn-content{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.sn-brand-title{font-size:18px;font-weight:700;color:#2563eb;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #f3f4f6}
.sn-step{font-size:15px;color:#374151;line-height:2.2;white-space:pre-line}

.zm{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:100;justify-content:center;align-items:center}

var sheetScreens = {"四角齐全":"images/四角齐全.jpg","能良苹果5张":"images/能良苹果5张.jpg","佳明穿戴&苹果17AIR":"images/佳明穿戴&苹果17AIR.jpg"};
var currentSub = 0;
var qaFilter = 'all';
var snCategory = '手机';
var snBrand = null;

function colLetterToNum(l){let n=0;for(let i=0;i<l.length;i++)n=n*26+(l.charCodeAt(i)-64);return n}
function isCovered(merged,row,col){for(let i=0;i<merged.length;i++){const m=merged[i].match(/^([A-Z]+)(d+):([A-Z]+)(d+)$/);if(!m)continue;const c1=colLetterToNum(m[1]),r1=+m[2],c2=colLetterToNum(m[3]),r2=+m[4];if(row>=r1&&row<=r2&&col>=c1&&col<=c2)return!(col===c1&&row===r1)}return false}
function getSpan(merged,row,col){for(let i=0;i<merged.length;i++){const m=merged[i].match(/^([A-Z]+)(d+):([A-Z]+)(d+)$/);if(!m)continue;const c1=colLetterToNum(m[1]),r1=+m[2],c2=colLetterToNum(m[3]),r2=+m[4];if(row===r1&&col===c1)return{colspan:c2-c1+1}}return null}
function fmt(t){return t?t.replace(/
/g,'<br>'):''}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function goMain(tab){
  document.querySelectorAll('.main-tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', false));
  document.getElementById(tab + '-panel').classList.add('on');
  if (tab === 'photo' && !document.getElementById('photo-subnav').innerHTML) buildPhoto();
  if (tab === 'qa' && !document.getElementById('qa-content').innerHTML) buildQA();
  if (tab === 'sn' && !document.getElementById('sn-content').innerHTML) buildSN();
  window.scrollTo({top:0,behavior:'smooth'});
}

function buildPhoto(){
  const nav = document.getElementById('photo-subnav');
  const ct = document.getElementById('photo-content');
  nav.innerHTML = '';
  ct.innerHTML = '';

  photoData.forEach((s, i) => {
    const t = document.createElement('button');
    t.className = 'sub-tab' + (i === 0 ? ' on' : '');
    t.textContent = s.name;
    t.onclick = function(){goPhoto(i)};
    nav.appendChild(t);
  });

  photoData.forEach((s, i) => {
    const panel = document.createElement('div');
    panel.className = 'sub-panel';
    panel.id = 'photo-' + i;
    panel.style.display = i === 0 ? 'block' : 'none';

    let html = '';

    // Full-page screenshot for first 3 sheets
    if (sheetScreens[s.name]) {
      html += '<img src="' + sheetScreens[s.name] + '" class="full-shot" onclick="zoom(this.src)" alt="' + esc(s.name) + '">';
    }

    // Image gallery for extracted images
    if (s.imageIds && s.imageIds.length > 0 && !sheetScreens[s.name]) {
      html += '<div class="gallery">';
      s.imageIds.forEach(function(imgId, j){
        html += '<div class="card"><img src="images/img_' + imgId + '.jpg" onclick="zoom(this.src)" alt="示例" loading="lazy"><div class="cap">示例 ' + (j + 1) + '</div></div>';
      });
      html += '</div>';
    }

    // Tables
    if (s.rows && s.rows.length > 0) {
      html += '<table>';
      s.rows.forEach(function(row){
        let hasContent = false;
        let rowHTML = '';
        for (let c = 1; c <= s.maxCol; c++) {
          if (isCovered(s.mergedCells, row.rowNum, c)) continue;
          const cell = row.cells.find(function(x){return x.col === c});
          const text = cell ? cell.text : '';
          if (!text.trim()) continue;
          const sp = getSpan(s.mergedCells, row.rowNum, c);
          hasContent = true;
          const colCount = row.cells.filter(function(x){return x.text.trim() === text.trim()}).length;
          let cls = 'td';
          if (colCount >= 4 || text.match(/^[一二三四五六七八九]+[、.]/)) cls = 'sec';
          rowHTML += '<td class="' + cls + '"' + (sp ? ' colspan="' + sp.colspan + '"' : '') + '>' + fmt(text) + '</td>';
        }
        if (hasContent) html += '<tr>' + rowHTML + '</tr>';
      });
      html += '</table>';
    }

    if (!html) html = '<div class="empty">该模块以图片示例为主</div>';
    panel.innerHTML = html;
    ct.appendChild(panel);
  });
}

function goPhoto(i){
  currentSub = i;
  document.querySelectorAll('#photo-subnav .sub-tab').forEach(function(t, idx){t.classList.toggle('on', idx === i)});
  document.querySelectorAll('#photo-content .sub-panel').forEach(function(p, idx){p.style.display = idx === i ? 'block' : 'none'});
}

function buildQA(){
  const cats = ['全部'];
  qaData.forEach(function(q){ if (q.type && !cats.includes(q.type)) cats.push(q.type); });

  const catDiv = document.getElementById('qa-cats');
  catDiv.innerHTML = '';
  cats.forEach(function(c){
    const btn = document.createElement('button');
    btn.className = 'qa-cat' + (c === '全部' ? ' on' : '');
    btn.textContent = c;
    btn.onclick = function(){qaFilter = c === '全部' ? 'all' : c; renderQA();};
    catDiv.appendChild(btn);
  });
  renderQA();
}

function renderQA(items){
  items = items || qaData;
  const container = document.getElementById('qa-content');
  container.innerHTML = '';
  const filtered = items.filter(function(q){ return qaFilter === 'all' || q.type === qaFilter; });

  if (filtered.length === 0) {
    container.innerHTML = '<div class="qa-empty">未搜索到结果，请联系人工</div>';
    return;
  }

  filtered.forEach(function(q){
    const div = document.createElement('div');
    div.className = 'qa-item';
    div.innerHTML = '<div class="qa-q">' + esc(q.question) + '</div>' +
                    '<div class="qa-a">' + fmt(q.answer) + '</div>' +
                    (q.type ? '<span class="qa-tag">' + esc(q.type) + '</span>' : '');
    container.appendChild(div);
  });
}

function searchQA(){
  const kw = document.getElementById('qa-search').value.trim().toLowerCase();
  if (!kw) { renderQA(); return; }

  const scored = qaData.map(function(q){
    const qText = q.question.toLowerCase();
    const aText = q.answer.toLowerCase();
    let score = 0;
    if (qText === kw) score += 100;
    if (qText.includes(kw)) score += 50;
    if (aText.includes(kw)) score += 20;
    const kws = kw.split(/s+/).filter(Boolean);
    kws.forEach(function(k){ if (qText.includes(k)) score += 10; if (aText.includes(k)) score += 5; });
    return {q, score};
  }).filter(function(item){ return item.score > 0; }).sort(function(a,b){ return b.score - a.score; }).map(function(item){ return item.q; });

  renderQA(scored);
}

function buildSN(){
  const catDiv = document.getElementById('sn-cats');
  Object.keys(snData).forEach(function(cat){
    const btn = document.createElement('button');
    btn.className = 'sn-cat' + (cat === snCategory ? ' on' : '');
    btn.textContent = cat;
    btn.onclick = function(){snCategory = cat; snBrand = Object.keys(snData[cat])[0]; renderSN();};
    catDiv.appendChild(btn);
  });
  if (!snBrand || !snData[snCategory][snBrand]) snBrand = Object.keys(snData[snCategory])[0];
  renderSN();
}

function renderSN(){
  const brandDiv = document.getElementById('sn-brands');
  brandDiv.innerHTML = '';
  const brands = Object.keys(snData[snCategory] || {});
  brands.forEach(function(b){
    const btn = document.createElement('button');
    btn.className = 'sn-brand' + (b === snBrand ? ' on' : '');
    btn.textContent = b;
    btn.onclick = function(){snBrand = b; renderSN();};
    brandDiv.appendChild(btn);
  });

  const ct = document.getElementById('sn-content');
  const method = snData[snCategory] && snData[snCategory][snBrand];
  ct.innerHTML = '<div class="sn-content">' +
                   '<div class="sn-brand-title">' + esc(snBrand) + '</div>' +
                   '<div class="sn-step">' + esc(method) + '</div>' +
                 '</div>';
}

function zoom(s){document.getElementById('zi').src=s;document.getElementById('zm').classList.add('show')}
function closeZm(){document.getElementById('zm').classList.remove('show')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeZm()});

buildPhoto();
